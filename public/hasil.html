<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hasil Foto</title>
<meta name="description" content="Unduh hasil foto kamu sebelum kedaluwarsa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#ECEBE6; --ink:#1E2235; --navy:#1B2440; --muted:#6B6A66; --line:#2A2A2A; --warn:#9E2B25; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:Jost, system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  header { border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px; }
  .kicker { font-size:12px; letter-spacing:.25em; color:var(--muted); text-transform:uppercase; }
  h1 { font-weight:300; font-size:34px; line-height:1.05; margin-top:8px; }
  .lead { font-family:"Libre Baskerville", Georgia, serif; font-style:italic; font-size:14px; color:var(--muted); margin-top:10px; }
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .tabs button { font-family:inherit; border:1.5px solid var(--line); background:transparent; padding:10px 0; letter-spacing:.14em; font-size:13px; border-radius:3px; color:var(--ink); }
  .tabs button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .tabs button:disabled { opacity:.35; }
  .media { background:#fff; box-shadow:0 12px 32px rgba(0,0,0,.18); min-height:240px; display:grid; place-items:center; }
  .media img, .media video { width:100%; display:block; }
  .actions { display:grid; gap:10px; margin-top:18px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:12px; text-decoration:none; font-family:inherit; font-size:15px; letter-spacing:.12em; padding:16px; border-radius:4px; border:0; cursor:pointer; }
  .btn.primary { background:var(--navy); color:#fff; }
  .btn.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn svg { width:20px; height:20px; }
  .expiry { margin-top:18px; font-size:13px; color:var(--warn); text-align:center; }
  .msg { text-align:center; padding:60px 10px; font-size:18px; line-height:1.6; }
  .spinner { width:40px; height:40px; border:3px solid rgba(30,34,53,.15); border-top-color:var(--navy); border-radius:50%; animation:spin .9s linear infinite; margin:40px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  footer { margin-top:28px; border-top:1px solid var(--line); padding-top:12px; font-size:12px; letter-spacing:.2em; color:var(--muted); display:flex; justify-content:space-between; }
  .demo { background:#fff3cd; color:#664d03; font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker" id="event">Photobooth</div>
    <h1>Kenangan kamu<br>sudah siap.</h1>
    <p class="lead">Unduh hasil foto kamu sebelum kedaluwarsa.</p>
  </header>
  <div id="content"><div class="spinner"></div></div>
  <footer><span>MOMEN INDAH</span><span id="date"></span></footer>
</div>

<template id="tpl-view">
  <div class="demo" id="demo" hidden>Mode demo: hasil dibaca dari penyimpanan lokal perangkat kiosk.</div>
  <div class="tabs">
    <button data-tab="photo" class="on">FOTO</button>
    <button data-tab="gif">GIF</button>
    <button data-tab="video">LIVE</button>
  </div>
  <div class="media" id="media"></div>
  <div class="actions">
    <a class="btn primary" id="dl" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span id="dl-label">UNDUH FOTO</span></a>
    <button class="btn ghost" id="share" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8h16v-8M12 3v13M7 8l5-5 5 5"/></svg>BAGIKAN</button>
  </div>
  <p class="expiry" id="expiry"></p>
</template>

<script type="module">
import { CONFIG } from '/js/config.js';
import { getCloud, getLocal } from '/js/storage.js';

const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search);
const id = q.get('id') || location.pathname.split('/').filter(Boolean).pop();
const isLocal = q.has('local');
$('#event').textContent = CONFIG.eventName;

function message(html) { $('#content').innerHTML = `<div class="msg">${html}</div>`; }

const LABEL = { photo: 'UNDUH FOTO', gif: 'UNDUH GIF', video: 'UNDUH VIDEO' };
const EXT = (type, kind) => kind === 'photo' ? 'jpg' : kind === 'gif' ? 'gif' : (type || '').includes('mp4') ? 'mp4' : 'webm';

async function load() {
  if (!id || !/^[0-9a-f-]{36}$/i.test(id)) return message('Tautan tidak valid.');
  let rec, media = {};
  try {
    if (isLocal) {
      rec = await getLocal(id);
      if (!rec) return message('Hasil tidak ditemukan di perangkat ini.<br><small>Mode demo hanya bisa dibuka di browser kiosk.</small>');
      for (const k of ['photo', 'gif', 'video']) if (rec[k]) media[k] = { url: URL.createObjectURL(rec[k]), type: rec[k].type };
    } else {
      rec = await getCloud(id);
      if (rec.error === 'notfound') return message('Foto tidak ditemukan.');
      if (rec.error === 'expired') return message('Maaf, masa simpan foto ini sudah <b>kedaluwarsa</b>.');
      if (rec.photo_url) media.photo = { url: rec.photo_url, type: 'image/jpeg' };
      if (rec.gif_url) media.gif = { url: rec.gif_url, type: 'image/gif' };
      if (rec.video_url) media.video = { url: rec.video_url, type: rec.video_url.endsWith('.mp4') ? 'video/mp4' : 'video/webm' };
    }
  } catch (e) { console.error(e); return message('Gagal memuat hasil. Coba muat ulang halaman.'); }

  $('#content').innerHTML = ''; $('#content').append($('#tpl-view').content.cloneNode(true));
  if (isLocal) $('#demo').hidden = false;
  const created = new Date(rec.created_at || Date.now());
  $('#date').textContent = created.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  const exp = rec.expires_at ? new Date(rec.expires_at) : new Date(created.getTime() + CONFIG.retentionDays * 864e5);
  $('#expiry').textContent = 'Tersedia sampai ' + exp.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  let current = 'photo';
  document.querySelectorAll('.tabs button').forEach(b => {
    b.disabled = !media[b.dataset.tab];
    b.onclick = () => show(b.dataset.tab);
  });
  function show(kind) {
    current = kind;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === kind));
    const m = media[kind];
    $('#media').innerHTML = kind === 'video'
      ? `<video src="${m.url}" controls autoplay loop muted playsinline></video>`
      : `<img src="${m.url}" alt="Hasil ${kind}">`;
    $('#dl-label').textContent = LABEL[kind];
  }
  show('photo');

  async function blobOf(kind) { const r = await fetch(media[kind].url); return r.blob(); }
  $('#dl').onclick = async (e) => {
    e.preventDefault();
    const name = `photobooth-${id.slice(0, 8)}.${EXT(media[current].type, current)}`;
    try {
      const b = await blobOf(current); const u = URL.createObjectURL(b);
      const a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    } catch { window.open(media[current].url, '_blank'); } // cadangan bila CORS menolak
  };
  if (navigator.canShare) {
    $('#share').hidden = false;
    $('#share').onclick = async () => {
      try {
        const b = await blobOf(current);
        const file = new File([b], `photobooth.${EXT(b.type, current)}`, { type: b.type });
        if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: CONFIG.eventName });
        else await navigator.share({ url: location.href, title: CONFIG.eventName });
      } catch (e) { /* dibatalkan */ }
    };
  }
}
load();
</script>
</body>
</html>
